[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tsukimi"]

[workspace.package]
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
mutsumi-prelude = { version = "0.1.0", path = "crates/mutsumi-prelude" }
danmakw = { version = "0.3.0", path = "crates/danmakw" }
mutsumi = { version = "0.6.0", path = "crates/mutsumi" }
dandanapi = { version = "0.2.0", path = "crates/dandanapi" }
dandanapi-client = { version = "0.1.0", path = "crates/dandanapi-client" }

adw = { version = "0.9", package = "libadwaita" }
age = "0.12"
anyhow = "1.0"
arc-swap = "1.9.1"
ash = "0.38"
atomic-wait = "1.1.0"
base64 = "0.23.0"
bytefmt = "0.1.7"
cargo-husky = { version = "1", default-features = false }
chrono = "0.4"
clap = "4"
derive_builder = "0.20.2"
flume = "0.12.0"
fnv = "1.0.7"
futures = "0.3"
futures-util = "0.3.31"
gdk-wayland = { version = "0.11", package = "gdk4-wayland" }
gdk-x11 = { version = "0.11", package = "gdk4-x11" }
gettext-rs = "~0.8"
glib = "0.22"
glib-build-tools = "0.22"
glow = "0.18"
glycin = { version = "3.1.0", default-features = false }
gst = { version = "0.25", package = "gstreamer" }
gtk = { version = "0.11", package = "gtk4" }
hostname = "0.4.2"
itertools = "0.15.0"
libc = "0.2"
libloading = "0.9"
libmpv2 = "6.0"
libmpv2-sys = "4.0.1"
moka = "0.12.15"
mpris-server = "0.10"
once_cell = "1.21.4"
pango = "0.22"
plotly = "0.14.1"
quick-xml = "0.41"
rand = "0.10.1"
regex = "1.12.3"
reqwest = "0.13"
serde = "1.0.228"
serde_json = "1.0"
sha2 = "0.11"
strsim = "0.11.1"
thiserror = "2.0"
tokio = "1.53"
tracing = "0.1.44"
tracing-subscriber = "0.3"
url = "2.5.8"
uuid = "1.23"
wl-proxy = "0.1"
xxhash-rust = "0.8.15"

[profile.release]
lto = true
strip = true
debug = "limited"
codegen-units = 1

[profile.dev]
debug = true
