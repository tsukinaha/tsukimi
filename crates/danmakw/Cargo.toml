[package]
name = "danmakw"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "A danmaku engine for gtk4"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_22"] }
glib = "0.22"
quick-xml = { version = "0.41", features = ["serialize"] }
pango = "0.22"
thiserror = "2.0"
