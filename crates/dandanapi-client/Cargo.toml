[package]
name = "dandanapi-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "MIT"
description = "A Rust client for the dandanapi API."

[dependencies]
dandanapi.workspace = true
age = "0.12"
base64 = "0.23"
chrono = "0.4"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = "1.53"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
