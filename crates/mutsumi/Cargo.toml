[package]
name = "mutsumi"
version = "0.6.0"
edition = "2024"
license = "MIT"
description = "wl-proxy based GTK MPV embedder"

[features]
profiling = ["dep:plotly", "dep:serde", "plotly/plotly_embed_js"]

[dependencies]
flume = "0.12.0"
libc = "0.2"
libloading = "0.9"
libmpv2 = "6.0"
once_cell = "1.21"
plotly = { version = "0.14.1", optional = true }
gtk = { version = "0.11", package = "gtk4", features = ["v4_22"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_9"] }
tracing = "0.1.44"
atomic-wait = "1.1.0"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "sync", "net", "macros"] }
ash = { version = "0.38" }
glib = "0.22"
tracing-subscriber = "0.3"
glow = "0.18"
mutsumi-prelude = "0.1"
danmakw = "0.3"
libmpv2-sys = "4.0.1"
quick-xml = { version = "0.41", features = ["serialize"] }
thiserror = "2.0"

[build-dependencies]
glib-build-tools = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gdk-x11 = { version = "0.11", package = "gdk4-x11", features = [
  "v4_10",
  "xlib",
] }
gdk-wayland = { version = "0.11", package = "gdk4-wayland", features = [
  "v4_10",
  "wayland_crate",
] }
wl-proxy = { version = "0.1", features = [
  "protocol-drm",
  "protocol-linux_dmabuf_v1",
  "protocol-xdg_shell",
  "protocol-viewporter",
  "protocol-fractional_scale_v1",
] }

[[example]]
name = "player"
path = "example/player.rs"

[[example]]
name = "mpv"
path = "example/mpv.rs"

[[example]]
name = "danmakw"
path = "example/danmakw.rs"
